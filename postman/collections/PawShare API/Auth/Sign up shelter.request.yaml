$kind: http-request
url: "{{baseUrl}}/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Happy Tails Shelter",
      "email": "{{shelterEmail}}",
      "password": "secret123",
      "role": "shelter",
      "location": {
        "city": "Hyderabad",
        "state": "Telangana",
        "coordinates": {
          "coordinates": [
            78.45,
            17.4
          ]
        }
      }
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("shelterEmail", `shelter.${Date.now()}@pawshare.test`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      if (json.token !== undefined) pm.collectionVariables.set("shelterToken", json.token);
      if (json.user && json.user.id !== undefined) pm.collectionVariables.set("shelterId", json.user && json.user.id);
    language: text/javascript
order: 2000
