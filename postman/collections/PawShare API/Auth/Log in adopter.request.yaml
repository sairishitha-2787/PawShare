$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adopterEmail}}",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
      const json = pm.response.json();
      if (json.token !== undefined) pm.collectionVariables.set("adopterToken", json.token);
    language: text/javascript
order: 3000
