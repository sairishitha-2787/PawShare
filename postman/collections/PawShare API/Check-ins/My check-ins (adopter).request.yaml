$kind: http-request
description: "Filters: status=pending|completed|overdue, dueWithin=<days>."
url: "{{baseUrl}}/checkins/mine"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adopterToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
      const json = pm.response.json();
      if (json.checkIns && json.checkIns[0] && json.checkIns[0]._id !== undefined) pm.collectionVariables.set("checkInId", json.checkIns && json.checkIns[0] && json.checkIns[0]._id);
    language: text/javascript
order: 1000
