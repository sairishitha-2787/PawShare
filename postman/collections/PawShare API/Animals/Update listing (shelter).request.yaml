$kind: http-request
url: "{{baseUrl}}/animals/{{animalId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Friendly lab who loves fetch and long walks."
    }
auth:
  type: bearer
  credentials:
    token: "{{shelterToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 6000
