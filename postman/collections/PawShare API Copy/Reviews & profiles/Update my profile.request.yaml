$kind: http-request
url: "{{baseUrl}}/users/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "9123456780",
      "location": {
        "city": "Hyderabad",
        "state": "Telangana"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{adopterToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 7000
