$kind: http-request
url: "{{baseUrl}}/users/{{adopterId}}/adoption-history"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adopterToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 6000
