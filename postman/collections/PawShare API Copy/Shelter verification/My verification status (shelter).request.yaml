$kind: http-request
url: "{{baseUrl}}/verification/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{shelterToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 5000
