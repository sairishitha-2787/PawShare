$kind: http-request
description: "decision: approve | reject. Rejecting an approved shelter revokes verification."
url: "{{baseUrl}}/admin/shelters/{{shelterId}}/verification"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "approve",
      "note": "Registration checked"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 4000
