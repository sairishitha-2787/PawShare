$kind: http-request
url: "{{baseUrl}}/applications/received?status=pending"
method: GET
queryParams:
  status: pending
auth:
  type: bearer
  credentials:
    token: "{{shelterToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 2xx", () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 3000
